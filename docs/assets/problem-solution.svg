<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" fill="none">
  <rect width="1100" height="380" fill="#F7F6F3"/>

  <!-- Problem -->
  <rect x="40" y="40" width="480" height="300" rx="16" fill="#FFFFFF" stroke="#E8E4DC"/>
  <rect x="40" y="40" width="480" height="48" rx="16" fill="#FDECEC"/>
  <text x="280" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#C0392B">The Problem</text>

  <text x="70" y="120" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; Hosts guess nightly prices from gut feel</text>
  <text x="70" y="150" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; No visibility into neighborhood demand</text>
  <text x="70" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; Events &amp; seasonality catch them off guard</text>
  <text x="70" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; Under-price busy weekends, over-price slow weeks</text>
  <text x="70" y="240" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; Market data scattered across platforms</text>

  <rect x="70" y="270" width="180" height="48" rx="8" fill="#F0EEE9"/>
  <text x="160" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#6B6459">Ksh ???</text>

  <!-- Arrow -->
  <path d="M540 190 L580 190" stroke="#C8922A" stroke-width="3"/>
  <path d="M572 182 L588 190 L572 198" fill="#C8922A"/>

  <!-- Solution -->
  <rect x="580" y="40" width="480" height="300" rx="16" fill="#FFFFFF" stroke="#E8E4DC"/>
  <rect x="580" y="40" width="480" height="48" rx="16" fill="#EAF7F1"/>
  <text x="820" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1A7F5A">The Solution  Pumzika</text>

  <text x="610" y="120" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; XGBoost recommends tonight&apos;s optimal price</text>
  <text x="610" y="150" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; Prophet forecasts 30-day occupancy per area</text>
  <text x="610" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; Kenya map drills down to neighborhood comps</text>
  <text x="610" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; Voice AI answers pricing questions in Kiswahili/English</text>
  <text x="610" y="240" font-family="system-ui, sans-serif" font-size="14" fill="#141410">&#x2022; One dashboard  data baked in, no guesswork</text>

  <rect x="610" y="270" width="200" height="48" rx="8" fill="#141410"/>
  <text x="710" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#F7F6F3">Ksh 12,400</text>
  <rect x="830" y="280" width="90" height="28" rx="14" fill="#FDF3E0"/>
  <text x="875" y="299" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9B6E1A">+18% demand</text>
</svg>
